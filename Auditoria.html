<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría del Sistema</title>
</head>

<body>

    <!-- ENCABEZADO -->
    <section class="encabezado">

        <h1>Auditoría del Sistema</h1>

        <button id="btnExportar">
            Exportar Registro
        </button>

    </section>

    <!-- TARJETAS -->
    <section class="estadisticas">

        <div class="card">
            <p>Total Registros</p>
            <h2 id="totalRegistros"></h2>
        </div>

        <div class="card">
            <p>Inicios de Sesión</p>
            <h2 id="totalLogins"></h2>
        </div>

        <div class="card">
            <p>Agregadas</p>
            <h2 id="totalAgregadas"></h2>
        </div>

        <div class="card">
            <p>Modificaciones</p>
            <h2 id="totalModificaciones"></h2>
        </div>

        <div class="card">
            <p>Eliminaciones</p>
            <h2 id="totalEliminaciones"></h2>
        </div>

    </section>

    <!-- CONTENEDOR PRINCIPAL -->
    <section class="contenedor-auditoria">

        <!-- FILTROS -->
        <div class="filtros">

            <input
                type="text"
                id="buscarRegistro"
                placeholder="Buscar por usuario, acción o detalles..."
            >
            <select id="filtroProfesor">
                <option value="">Todos los profesores</option>
                <option></option>
                <option></option>
                <option></option>
                <option></option>
            </select>
            <select id="filtroAccion">
                <option value="">Todas las acciones</option>
                <option>Ingreso al sistema</option>
                <option>Cerró sesión</option>
                <option>Agregó nota</option>
                <option>Modificó nota</option>
                <option>Eliminó nota</option>
            </select>
            <select id="filtroModulo">
                <option value="">Todos los módulos</option>
                <option>Autenticación</option>
                <option>Calificaciones</option>
                <option>Estudiantes</option>
            </select>

        </div>
        <!-- NOTA -->
        <div class="nota">
            <strong>Nota:</strong>
            Este registro muestra todas las acciones realizadas en el sistema.
            Los registros se mantienen por un período de 90 días.
        </div>
        <!-- TABLA -->
        <div class="tabla-responsive">
            <table id="tablaAuditoria">
                <thead>
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Usuario</th>
                        <th>Acción</th>
                        <th>Detalles</th>
                        <th>Módulo</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>
                            <span class="modulo autenticacion">
                            </span>
                        </td>
                        <td>
                            <span class="tipo informacion">
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>
                            <span class="modulo calificaciones">
                            </span>
                        </td>
                        <td>
                            <span class="tipo modificacion">
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>
                            <span class="modulo calificaciones">
                            </span>
                        </td>
                        <td>
                            <span class="tipo creacion">
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td>
                            <span class="modulo calificaciones">
                            </span>
                        </td>
                        <td>
                            <span class="tipo eliminacion">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>

</html>
