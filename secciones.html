<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Académico - Gestión de Secciones</title>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Gestión de Secciones</h1>
        <p>Vista general de todas las secciones del sistema</p>
        <div>
            <span><!-- Aquí irá el conteo total de secciones --> Secciones</span>
        </div>
    </header>

    <!-- CONTENEDOR DE TARJETAS (MOCKUP) -->
    <section>
        <h2>Vista de Tarjetas</h2>
        
        <!-- Estructura de tarjeta individual para replicar con DB -->
        <article>
            <div><!-- ID o Número de Sección --></div>
            <h3><!-- Nombre de la Sección --></h3>
            <p><!-- Especialidad --></p>
            
            <ul>
                <li>Estudiantes: <!-- Cantidad --></li>
                <li>Año: <!-- Nivel --></li>
            </ul>

            <div>
                <p>Profesores asignados:</p>
                <p><!-- Conteo de docentes --></p>
            </div>

            <button type="button">Ver Detalles</button>
        </article>
    </section>

    <hr>

    <!-- ESTRUCTURA DE TABLA (LISTA COMPLETA) -->
    <section>
        <h2>Lista Completa de Secciones</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Sección</th>
                    <th>Especialidad</th>
                    <th>Año</th>
                    <th>Estudiantes</th>
                    <th>Materias</th>
                </tr>
            </thead>
            <tbody>
                <!-- Fila de ejemplo vacía para llenado dinámico -->
                <tr>
                    <td><button type="button"><!-- Nombre Sección --></button></td>
                    <td><!-- Info Especialidad --></td>
                    <td><!-- Info Año --></td>
                    <td><!-- Info Estudiantes --></td>
                    <td><!-- Lista de Materias --></td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- NOTA PIE DE PÁGINA -->
    <footer>
        <p><strong>Nota:</strong> <!-- Texto informativo sobre asignación de profesores y materias --></p>
    </footer>

</body>
</html>
