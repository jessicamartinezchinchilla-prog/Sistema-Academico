<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Estudiantes</title>
</head>
<body>

    <section id="gestionEstudiantes">

        <h1>Gestión de Estudiantes</h1>
        <p>Vista general de todos los estudiantes del sistema</p>

        <hr>

        <!-- Estadísticas -->
        <table>
            <tr>

                <td>
                    <h3>Total Estudiantes</h3>
                    <h2></h2>
                </td>

                <td>
                    <h3>Activos</h3>
                    <h2></h2>
                </td>

                <td>
                    <h3>Inactivos</h3>
                    <h2></h2>
                </td>

                <td>
                    <h3>Secciones</h3>
                    <h2></h2>
                </td>

            </tr>
        </table>

        <br>

        <!-- Filtros -->
        <input type="text" placeholder="Buscar por NIE, nombre o apellido...">

        <select>
            <option>Todas las secciones</option>
        </select>

        <select>
            <option>Todos los estados</option>
        </select>

        <br><br>

        <!-- Botón agregar -->
        <button>Agregar Estudiante</button>

        <br><br>

        <!-- Tabla -->
        <table border="1">

            <thead>
                <tr>
                    <th>NIE</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Sección</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>
                        <button>Editar</button>
                        <button>Eliminar</button>
                    </td>
                </tr>

            </tbody>

        </table>

    </section>

</body>
</html>
